name: publish

# A tag: wheels and sources are built once, checked on every platform and published on TestPyPI;
# a version without .devN then goes to PyPI - the same files - and the crate essyntax to crates.io.
# A pull request that changes publishing or the build runs the same chain without publishing

on:
  push:
    tags:
      - "*"
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "scripts/smoke.py"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      - name: Check version matches tag
        if: github.event_name == 'push'
        run: |
          version="$(uv version --short)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Version in pyproject.toml ($version) does not match the tag ($GITHUB_REF_NAME)"
            exit 1
          fi
          # The crate publishes the version of Cargo.toml: 0.1.0-dev.5 is the semver of the tag 0.1.0.dev5
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "${crate/-dev./.dev}" != "$GITHUB_REF_NAME" ]; then
            echo "Version in Cargo.toml ($crate) does not match the tag ($GITHUB_REF_NAME)"
            exit 1
          fi

  # Every job builds an abi3 wheel for Python 3.11+ and wheels for the free-threaded Python 3.14t and
  # 3.15t, which abi3 does not cover
  wheels:
    name: wheels (${{ matrix.platform }})
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: auto
          - platform: manylinux aarch64
            os: ubuntu-latest
            target: aarch64
            manylinux: auto
          - platform: musllinux x86_64
            os: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - platform: musllinux aarch64
            os: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          # Both macOS wheels are built by one job: arm64 runners are often short
          - platform: macos
            os: macos-latest
            target: x86_64 aarch64
          - platform: windows x64
            os: windows-latest
            target: x64
            architecture: x64
          - platform: windows arm64
            os: windows-11-arm
            target: aarch64
            architecture: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # On Linux the build image has the interpreters, macOS builds for an explicit target by the
      # built-in settings of maturin, and Windows needs installed interpreters
      - name: Setup Python 3.11 (Windows)
        id: python-abi3
        if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.architecture }}
      - name: Setup Python 3.14t (Windows)
        id: python-free-threaded
        if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14t"
          architecture: ${{ matrix.architecture }}
      - name: Setup Python 3.15t (Windows)
        id: python-free-threaded-next
        if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15t"
          architecture: ${{ matrix.architecture }}
      - name: Setup Rust (Windows arm64)
        if: matrix.os == 'windows-11-arm'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build wheels
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: --release --locked --compatibility pypi --out dist -i python3.11 python3.14t python3.15t
          manylinux: ${{ matrix.manylinux }}
      - name: Build wheels (Windows)
        if: runner.os == 'Windows'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: >-
            --release --locked --compatibility pypi --out dist
            -i ${{ steps.python-abi3.outputs.python-path }} ${{ steps.python-free-threaded.outputs.python-path }}
            ${{ steps.python-free-threaded-next.outputs.python-path }}
      - name: Build wheels (macOS x86_64)
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: x86_64
          args: --release --locked --compatibility pypi --out dist -i python3.11 python3.14t python3.15t
      - name: Build wheels (macOS aarch64)
        if: runner.os == 'macOS'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: aarch64
          args: --release --locked --compatibility pypi --out dist -i python3.11 python3.14t python3.15t
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ strategy.job-index }}
          path: dist
          if-no-files-found: error

  sdist:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.os }}, ${{ matrix.python-version }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest, windows-11-arm]
        python-version: ["3.11", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
          python-version: ${{ matrix.python-version }}
      # essyntax is the wheel of this run, its dependencies anyseg and esmorph are wheels from PyPI
      - name: Smoke test
        run: |
          version=$(ls dist/*.whl | head -n 1 | sed -E 's|.*/essyntax-([^-]+)-.*|\1|')
          uv run --isolated --no-project --no-build --find-links dist --with "essyntax==$version" \
            python scripts/smoke.py ${{ github.event_name == 'push' && github.ref_name || '' }}
        shell: bash

  # The musllinux wheels are checked in the musllinux image: it has Python 3.11, 3.14t and 3.15t
  smoke-musl:
    name: smoke (musllinux, ${{ matrix.arch }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Smoke test
        env:
          IMAGE: quay.io/pypa/musllinux_1_2_${{ matrix.arch }}:2026.10.10-1
          VERSION: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e VERSION "$IMAGE" sh -ec '
            for python in python3.11 python3.14t python3.15t; do
              "$python" -m venv "/tmp/$python"
              version=$(ls dist/*.whl | head -n 1 | sed -E "s|.*/essyntax-([^-]+)-.*|\1|")
              "/tmp/$python/bin/pip" install --quiet --only-binary :all: --find-links dist "essyntax==$version"
              "/tmp/$python/bin/python" scripts/smoke.py $VERSION
            done'

  smoke-sdist:
    needs: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
          python-version: "3.13"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # This is how conda-forge and distributions build from source: with the Cargo.lock of the archive
      - name: Build wheel from sdist
        run: |
          mkdir build
          tar xzf dist/*.tar.gz -C build
          cd build/*/
          uvx maturin@1.15.0 build --release --locked --out ../../wheel
      - name: Smoke test
        run: |
          version=$(ls wheel/*.whl | head -n 1 | sed -E 's|.*/essyntax-([^-]+)-.*|\1|')
          uv run --isolated --no-project --no-build --find-links wheel --with "essyntax==$version" \
            python scripts/smoke.py ${{ github.event_name == 'push' && github.ref_name || '' }}

  # The crate is packaged on every run; only versions without .devN are published
  crates-check:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # crates.io accepts at most 5 keywords of up to 20 characters, and cargo package does not
      # check it
      - name: Check crate keywords
        run: |
          cargo metadata --no-deps --format-version 1 \
            | jq -e '.packages[] | select(.name == "essyntax") | .keywords | length <= 5 and all(.[]; length <= 20)' \
            || { echo "The keywords of essyntax break the limits of crates.io"; exit 1; }
      - name: Package crate
        run: cargo package --locked -p essyntax --all-features

  # Checked apart from the jobs that may publish
  check-distribution:
    needs: [smoke, smoke-musl, smoke-sdist, crates-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
          python-version: "3.13"
      - name: Check distribution
        run: |
          uvx twine@7.0.0 check --strict dist/*
          count="$(ls dist/*.whl | wc -l)"
          [ "$count" -eq 24 ] || { echo "Expected 24 wheels, got $count"; exit 1; }
          ls -l dist
          sha256sum dist/*

  testpypi:
    if: github.event_name == 'push'
    needs: check-distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      # Wheels are not reproducible byte for byte, and the index rejects a file with the same name:
      # a rerun uploads only the files that are not on the index yet
      - name: Publish distribution
        run: |
          uploaded="$(curl -sf "https://test.pypi.org/pypi/essyntax/$GITHUB_REF_NAME/json" | jq -r '.urls[].filename' || true)"
          files=()
          for file in dist/*; do
            grep -qxF "$(basename "$file")" <<< "$uploaded" || files+=("$file")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "essyntax $GITHUB_REF_NAME is already on TestPyPI"
            exit 0
          fi
          uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always "${files[@]}"

  pypi:
    # Versions X.Y.Z.devN go only to TestPyPI
    if: github.event_name == 'push' && !contains(github.ref_name, '.dev')
    needs: testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/project/essyntax/${{ github.ref_name }}/
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{wheels-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          enable-cache: false
      # A rerun uploads only the files that are not on PyPI yet, as on TestPyPI
      - name: Publish distribution
        run: |
          uploaded="$(curl -sf "https://pypi.org/pypi/essyntax/$GITHUB_REF_NAME/json" | jq -r '.urls[].filename' || true)"
          files=()
          for file in dist/*; do
            grep -qxF "$(basename "$file")" <<< "$uploaded" || files+=("$file")
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "essyntax $GITHUB_REF_NAME is already on PyPI"
            exit 0
          fi
          uv publish --trusted-publishing always "${files[@]}"

  crates:
    if: github.event_name == 'push' && !contains(github.ref_name, '.dev')
    needs: [crates-check, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/essyntax/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # A rerun after a failure skips a published version before authenticating: authentication
      # fails while the crate has no trusted publisher on crates.io
      - name: Check crates.io
        id: index
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "essyntax") | .version')"
          if curl -sf "https://index.crates.io/es/sy/essyntax" | grep -qF "\"vers\":\"$version\""; then
            echo "essyntax $version is already on crates.io"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authenticate
        id: auth
        if: steps.index.outputs.published != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish crate
        if: steps.index.outputs.published != 'true'
        run: cargo publish --locked -p essyntax --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
