[workspace]
members = ["crates/essyntax", "crates/essyntax-py"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.4"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Sergey Shkarin <kouki.sergey@gmail.com>"]
repository = "https://github.com/SergeyShk/esSyntax"

[profile.release]
lto = "fat"
codegen-units = 1

# The check test parses a file with the real model: without optimizations it takes a minute instead of a second
[profile.test]
opt-level = 3
